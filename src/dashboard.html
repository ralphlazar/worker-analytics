<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Traffic · __SITE_NAME__</title>
<style>
  [hidden]{display:none!important}
  /* First on purpose: any author display rule, like .row{display:grid}, would otherwise beat the browser's own [hidden]. */
  :root{--paper:#faf8f4;--paper-dim:#f1ede4;--ink:#1c1a17;--soft:#5a544c;--faint:#8a8378;--line:#e3ddd0;--green:#3f5d45;--red:#c1272d;--bar:#d9d2c3;--accent:#1c1a17}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button,input,select{font:inherit;color:inherit}
  .top{display:flex;flex-wrap:wrap;gap:.75rem 1.25rem;align-items:center;padding:1rem 1.5rem;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:2}
  .brand{font-weight:600;letter-spacing:.01em}
  .brand span{font-weight:400;color:var(--soft)}
  .live{display:flex;align-items:center;gap:.4rem;color:var(--soft)}
  .live b{color:var(--ink)}
  .live::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--green)}
  .live.quiet::before{background:var(--faint)}
  .ranges{display:flex;flex-wrap:wrap;gap:.25rem;margin-left:auto;align-items:center}
  .ranges button,.ranges input,.top form button,.export{background:#fff;border:1px solid var(--line);border-radius:4px;padding:.35rem .6rem;cursor:pointer;text-decoration:none;font-size:13px}
  .ranges button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .ranges .custom{display:flex;gap:.25rem;align-items:center;margin-left:.5rem}
  main{padding:1.5rem;max-width:1440px;margin:0 auto}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:.75rem;margin-bottom:1rem}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:6px;padding:.9rem 1rem}
  .kpi .l{color:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  .kpi .v{font-size:1.6rem;font-weight:500;line-height:1.2;margin:.2rem 0}
  .kpi .d{font-size:12px;color:var(--faint)}
  .kpi .d.up{color:var(--green)} .kpi .d.down{color:var(--red)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:1rem;grid-auto-flow:dense}
  .panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1rem 1.1rem;min-width:0}
  .panel.wide{grid-column:1/-1}
  .panel h2{font-size:13px;font-weight:600;margin:0 0 .6rem;display:flex;align-items:baseline;gap:.6rem}
  .panel h2 small{font-weight:400;color:var(--faint);margin-left:auto;font-size:12px}
  .tabs{display:flex;gap:.2rem;margin-bottom:.5rem}
  .tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:.2rem .4rem;cursor:pointer;color:var(--soft);font-size:13px}
  .tabs button[aria-selected="true"]{border-color:var(--ink);color:var(--ink)}
  .list{margin:0;padding:0;list-style:none}
  .row{display:grid;grid-template-columns:1fr auto auto;gap:.75rem;align-items:center;padding:.3rem 0;position:relative;font-size:13px}
  .row .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1;padding:.15rem .4rem;min-width:0}
  .row .k a{text-decoration:none}
  .row .k a:hover{text-decoration:underline}
  .row .bar{position:absolute;left:0;top:.3rem;bottom:.3rem;background:var(--paper-dim);border-radius:3px;z-index:0}
  .row .n{font-variant-numeric:tabular-nums;color:var(--ink);z-index:1;min-width:2.5rem;text-align:right}
  .row .m{font-variant-numeric:tabular-nums;color:var(--faint);z-index:1;min-width:2.5rem;text-align:right;font-size:12px}
  .head{display:grid;grid-template-columns:1fr auto auto;gap:.75rem;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding:0 .4rem .3rem}
  [data-paged]{display:flex;flex-direction:column}
  .pager{display:flex;align-items:center;justify-content:flex-end;gap:.5rem;margin-top:auto;padding-top:.6rem;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
  .pager button{background:#fff;border:1px solid var(--line);border-radius:4px;width:1.7rem;height:1.7rem;padding:0;cursor:pointer;color:var(--soft);font-size:16px;line-height:1}
  .pager button:hover:not(:disabled){color:var(--ink);border-color:var(--soft)}
  .pager button:disabled{opacity:.35;cursor:default}
  .empty{color:var(--faint);font-size:13px;padding:.4rem}
  .chart{width:100%;height:240px;display:block}
  .chart .grid line{stroke:var(--line);stroke-width:1}
  .chart text{font-size:11px;fill:var(--faint)}
  .chart .views{fill:none;stroke:var(--faint);stroke-width:1.5}
  .chart .visitors{fill:none;stroke:var(--ink);stroke-width:2}
  .chart .area{fill:var(--paper-dim)}
  .chart .cursor{stroke:var(--ink);stroke-width:1;stroke-dasharray:2 3;opacity:0}
  .legend{display:flex;gap:1rem;font-size:12px;color:var(--soft);margin-top:.4rem}
  .legend i{display:inline-block;width:1rem;height:0;border-top:2px solid var(--ink);vertical-align:middle;margin-right:.3rem}
  .legend i.views{border-top:1.5px solid var(--faint)}
  .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);padding:.35rem .5rem;border-radius:4px;font-size:12px;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .1s}
  .heat{display:grid;grid-template-columns:2.2rem repeat(24,1fr);gap:2px;font-size:10px;color:var(--faint)}
  .heat>*{min-width:0}
  @media (min-width:900px){.panel.two{grid-column:span 2}}
  .heat .c{aspect-ratio:1;border-radius:2px;background:var(--ink)}
  .heat .lab{display:flex;align-items:center}
  .heat .h{text-align:center}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{text-align:left;padding:.3rem .4rem;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-weight:500;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  td:first-child,th:first-child,td:last-child,th:last-child{white-space:nowrap}
  .note{color:var(--faint);font-size:12px;max-width:70ch;margin:1.5rem 0 0}
  .flag{margin-right:.35rem}
  .status{padding:2rem;color:var(--soft)}
  @media (max-width:640px){main{padding:1rem}.top{padding:.75rem 1rem}.ranges{margin-left:0}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">__SITE_NAME__ <span>traffic</span></div>
  <div class="live quiet" id="live">…</div>
  <nav class="ranges" id="ranges" aria-label="Range">
    <button data-range="today">Today</button>
    <button data-range="yesterday">Yesterday</button>
    <button data-range="7d">7 days</button>
    <button data-range="30d" aria-pressed="true">30 days</button>
    <button data-range="90d">90 days</button>
    <button data-range="12m">12 months</button>
    <button data-range="all">All</button>
    <span class="custom"><input type="date" id="from" aria-label="From"> <span>–</span> <input type="date" id="to" aria-label="To"> <button id="apply">Apply</button></span>
  </nav>
  <a class="export" id="export" href="#" download>Export CSV</a>
  <form method="post" action="__PREFIX__/logout"><button type="submit">Log out</button></form>
</header>
<main id="main"><p class="status">Loading…</p></main>
<div class="tip" id="tip"></div>
<script id="analytics-config" type="application/json">__ANALYTICS_CONFIG__</script>
<script>
(() => {
  const $ = (sel, el = document) => el.querySelector(sel);
  const main = $('#main');
  // Per-site configuration, injected by the Worker when it serves this page.
  const CONFIG = JSON.parse($('#analytics-config').textContent);
  const PREFIX = CONFIG.prefix;
  const tz = -new Date().getTimezoneOffset();
  const LAUNCH = CONFIG.launchDate ? new Date(`${CONFIG.launchDate}T00:00:00`) : null;
  let state = { range: '30d', from: 0, to: 0 };
  let titles = new Map();
  let names;
  try { names = new Intl.DisplayNames(['en'], { type: 'region' }); } catch { names = null; }

  const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const unix = (d) => Math.floor(d.getTime() / 1000);
  const fmtN = (n) => n.toLocaleString('en-GB');
  const fmtPct = (n) => `${Math.round(n * 100)}%`;
  const fmtDur = (s) => s < 60 ? `${Math.round(s)}s` : `${Math.floor(s / 60)}m ${Math.round(s % 60)}s`;
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const flag = (cc) => /^[A-Z]{2}$/.test(cc) ? String.fromCodePoint(...[...cc].map((c) => 0x1f1e6 + c.charCodeAt(0) - 65)) : '';
  const country = (cc) => {
    if (!cc || cc === '??') return 'Unknown';
    try { return names ? names.of(cc) : cc; } catch { return cc; }
  };

  function rangeFor(key) {
    const now = new Date();
    const today = startOfDay(now);
    const to = unix(now) + 60;
    switch (key) {
      case 'today': return { from: unix(today), to };
      case 'yesterday': return { from: unix(addDays(today, -1)), to: unix(today) };
      case '7d': return { from: unix(addDays(today, -6)), to };
      case '30d': return { from: unix(addDays(today, -29)), to };
      case '90d': return { from: unix(addDays(today, -89)), to };
      case '12m': { const x = new Date(today); x.setMonth(x.getMonth() - 12); return { from: unix(x), to }; }
      // Without a launch date, "All" is the longest range the API allows.
      case 'all': return { from: unix(LAUNCH || addDays(today, -(5 * 366 - 2))), to };
    }
    return null;
  }

  function setRange(key, from, to) {
    state = { range: key, from, to };
    for (const b of document.querySelectorAll('[data-range]')) b.setAttribute('aria-pressed', String(b.dataset.range === key));
    $('#from').value = new Date(from * 1000).toLocaleDateString('sv');
    $('#to').value = new Date((to - 1) * 1000).toLocaleDateString('sv');
    $('#export').href = `${PREFIX}/export.csv?from=${from}&to=${to}`;
    load();
  }

  for (const b of document.querySelectorAll('[data-range]')) {
    b.addEventListener('click', () => { const r = rangeFor(b.dataset.range); setRange(b.dataset.range, r.from, r.to); });
  }
  $('#apply').addEventListener('click', () => {
    const f = $('#from').valueAsDate, t = $('#to').valueAsDate;
    if (!f || !t) return;
    const from = unix(startOfDay(new Date(f.getUTCFullYear(), f.getUTCMonth(), f.getUTCDate())));
    const to = unix(addDays(startOfDay(new Date(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate())), 1));
    if (to > from) setRange('custom', from, to);
  });

  async function loadTitles() {
    if (!CONFIG.titlesUrl) return;
    try {
      const corpus = await (await fetch(CONFIG.titlesUrl)).json();
      titles = new Map(corpus.map((w) => [w.href, w.title]));
    } catch { /* titles are a nicety */ }
  }

  async function load() {
    const { from, to } = state;
    let report;
    try {
      const res = await fetch(`${PREFIX}/api?from=${from}&to=${to}&tz=${tz}`);
      if (res.status === 401) { location.reload(); return; }
      if (!res.ok) throw new Error(`${res.status}`);
      report = await res.json();
    } catch (e) {
      main.innerHTML = `<p class="status">Could not load the report (${esc(e.message)}).</p>`;
      return;
    }
    render(report);
  }

  async function refreshLive() {
    try {
      const live = await (await fetch(`${PREFIX}/api/live`)).json();
      renderLive(live);
    } catch { /* next tick */ }
  }

  function renderLive(live) {
    const el = $('#live');
    el.classList.toggle('quiet', live.visitors === 0);
    el.innerHTML = `<b>${fmtN(live.visitors)}</b>&nbsp;${live.visitors === 1 ? 'person' : 'people'} in the last 30 minutes`;
    el.title = live.pages.map((p) => `${p.key} (${p.views})`).join('\n');
  }

  const delta = (now, before, invert = false) => {
    if (!before) return '<span class="d">no earlier data</span>';
    const change = (now - before) / before;
    if (Math.abs(change) < 0.005) return '<span class="d">no change</span>';
    const good = invert ? change < 0 : change > 0;
    return `<span class="d ${good ? 'up' : 'down'}">${change > 0 ? '▲' : '▼'} ${fmtPct(Math.abs(change))} vs previous period</span>`;
  };

  function kpi(label, value, before, current, fmt = fmtN, invert = false) {
    return `<div class="kpi"><div class="l">${label}</div><div class="v">${fmt(current)}</div>${delta(current, before, invert)}</div>`;
  }

  function label(item, kind) {
    const k = item.key;
    if (kind === 'page') {
      const t = titles.get(k);
      return `<a href="${esc(k)}" target="_blank" rel="noopener">${esc(t ? `${t}` : k)}</a>${t ? ` <span style="color:var(--faint)">${esc(k)}</span>` : ''}`;
    }
    if (kind === 'country') return `<span class="flag">${flag(k)}</span>${esc(country(k))}`;
    if (kind === 'place') return `<span class="flag">${flag(item.country)}</span>${esc(item.name)}<span style="color:var(--faint)">, ${esc(country(item.country))}</span>`;
    if (kind === 'host') return `<a href="https://${esc(k)}" target="_blank" rel="noopener">${esc(k)}</a>`;
    if (kind === 'url') return `<a href="${esc(k)}" target="_blank" rel="noopener">${esc(k.replace(/^https?:\/\//, ''))}</a>`;
    if (kind === 'lang') { try { return esc(new Intl.DisplayNames(['en'], { type: 'language' }).of(k)); } catch { return esc(k); } }
    return esc(k);
  }

  // Ten rows a panel, however many the range holds. The rest are in the page
  // and the arrows walk through them, so a panel never grows past ten rows and
  // never stretches the grid row it sits in. A list of ten or fewer gets no
  // arrows at all.
  const PAGE = 10;
  const pager = (count) => (count > PAGE
    ? `<nav class="pager" aria-label="Further rows"><button type="button" data-prev aria-label="Previous ${PAGE}" disabled>‹</button><span data-pos>1–${PAGE} of ${fmtN(count)}</span><button type="button" data-next aria-label="Next ${PAGE}">›</button></nav>`
    : '');

  function list(items, kind, unit = 'views', second = 'visitors') {
    if (!items.length) return '<p class="empty">Nothing yet.</p>';
    const max = Math.max(...items.map((i) => i.views));
    const rows = items.map((i, n) => `<li class="row"${n >= PAGE ? ' hidden' : ''}><span class="bar" style="width:${(i.views / max * 100).toFixed(1)}%"></span><span class="k" title="${esc(i.key)}">${label(i, kind)}</span><span class="n">${fmtN(i.views)}</span><span class="m">${second ? fmtN(i.visitors) : ''}</span></li>`).join('');
    return `<div data-paged><div class="head"><span></span><span>${unit}</span><span>${second}</span></div><ul class="list" data-rows>${rows}</ul>${pager(items.length)}</div>`;
  }

  function panel(title, body, sub = '', cls = '') {
    return `<section class="panel ${cls}"><h2>${title}${sub ? `<small>${sub}</small>` : ''}</h2>${body}</section>`;
  }

  function tabbed(title, tabs) {
    const id = title.replace(/\W+/g, '-').toLowerCase();
    const buttons = tabs.map((t, i) => `<button role="tab" aria-selected="${i === 0}" data-tab="${id}-${i}">${t.name}</button>`).join('');
    const bodies = tabs.map((t, i) => `<div data-tabpanel="${id}-${i}" ${i ? 'hidden' : ''}>${t.body}</div>`).join('');
    return `<section class="panel"><h2>${title}</h2><div class="tabs" role="tablist">${buttons}</div>${bodies}</section>`;
  }

  function chart(series, bucket) {
    if (!series.length) return '<p class="empty">Nothing yet.</p>';
    const W = 960, H = 240, L = 40, R = 12, T = 12, B = 28;
    const max = Math.max(1, ...series.map((s) => s.pageviews));
    const x = (i) => L + (series.length === 1 ? 0 : (i / (series.length - 1)) * (W - L - R));
    const y = (v) => T + (1 - v / max) * (H - T - B);
    const path = (key) => series.map((s, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(s[key]).toFixed(1)}`).join(' ');
    const area = `${path('visitors')} L${x(series.length - 1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z`;
    const ticks = [0, 0.5, 1].map((f) => `<line x1="${L}" x2="${W - R}" y1="${y(max * f)}" y2="${y(max * f)}"/><text x="${L - 6}" y="${y(max * f) + 4}" text-anchor="end">${fmtN(Math.round(max * f))}</text>`).join('');
    const every = Math.ceil(series.length / 8);
    const labels = series.map((s, i) => i % every ? '' : `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${bucket === 'hour' ? s.t.slice(11) + ':00' : s.t.slice(5)}</text>`).join('');
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" data-chart>
      <g class="grid">${ticks}</g><path class="area" d="${area}"/><path class="views" d="${path('pageviews')}"/><path class="visitors" d="${path('visitors')}"/>
      <line class="cursor" data-cursor x1="0" x2="0" y1="${T}" y2="${H - B}"/>${labels}</svg>
      <div class="legend"><span><i></i>visitors</span><span><i class="views"></i>page views</span></div>`;
  }

  function heat(grid) {
    const max = Math.max(1, ...grid.flat());
    const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const head = `<span></span>${Array.from({ length: 24 }, (_, h) => `<span class="h">${h % 3 ? '' : h}</span>`).join('')}`;
    const rows = grid.map((r, d) => `<span class="lab">${days[d]}</span>${r.map((v, h) => `<span class="c" style="opacity:${(0.06 + 0.94 * v / max).toFixed(2)}" title="${days[d]} ${h}:00, ${fmtN(v)} views"></span>`).join('')}`).join('');
    return `<div class="heat">${head}${rows}</div>`;
  }

  // Events are listed under one panel. With one configured type it carries
  // that type's label and description; with more, a Type column tells them apart.
  function eventsPanel(events) {
    if (!CONFIG.events.length) return '';
    const one = CONFIG.events.length === 1 ? CONFIG.events[0] : null;
    const labelOf = (type) => { const e = CONFIG.events.find((x) => x.type === type); return e ? e.label : type; };
    const when = (e) => new Date(e.ts * 1000).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' });
    const body = events.length
      ? `<div data-paged><table><thead><tr><th>When</th>${one ? '' : '<th>Type</th>'}<th>About</th><th>From page</th></tr></thead><tbody data-rows>${events.map((e, n) => `<tr${n >= PAGE ? ' hidden' : ''}><td>${when(e)}</td>${one ? '' : `<td>${esc(labelOf(e.type))}</td>`}<td>${esc(e.detail || '')}</td><td>${esc(e.path || '')}</td></tr>`).join('')}</tbody></table>${pager(events.length)}</div>`
      : '<p class="empty">None in this period.</p>';
    return panel(one ? one.label : 'Events', body, one ? one.description : CONFIG.events.map((e) => e.label).join(', '), 'wide');
  }

  function render(r) {
    const t = r.totals, p = r.previous;
    const period = r.range.bucket === 'hour' ? 'by hour' : 'by day';
    main.innerHTML = `
      <section class="kpis">
        ${kpi('Visitors', 0, p.visitors, t.visitors)}
        ${kpi('Page views', 0, p.pageviews, t.pageviews)}
        ${kpi('Sessions', 0, p.sessions, t.sessions)}
        ${kpi('Pages / session', 0, p.pagesPerSession, t.pagesPerSession, (n) => n.toFixed(2))}
        ${kpi('Bounce rate', 0, p.bounceRate, t.bounceRate, fmtPct, true)}
        ${kpi('Session length', 0, p.avgSessionSeconds, t.avgSessionSeconds, fmtDur)}
        ${CONFIG.events.map((e) => kpi(e.label, 0, p.eventCounts[e.type] || 0, t.eventCounts[e.type] || 0)).join('')}
        ${kpi('Not found', 0, p.notFound, t.notFound, fmtN, true)}
      </section>
      ${panel(`Visitors and page views`, chart(r.series, r.range.bucket), period, 'wide')}
      <div class="grid">
        ${panel('Pages', list(r.pages, 'page'))}
        ${r.prefixPanels.map((x) => panel(x.title, list(x.list, 'page'), x.description || `${x.list.length} viewed`)).join('')}
        ${panel('Countries', list(r.countries, 'country'), `${r.countries.length}`)}
        ${panel('Cities', list(r.cities, 'place'))}
        ${panel('Regions', list(r.regions, 'place'))}
        ${panel('Referrers', list(r.referrers, 'host'), 'sites that sent people')}
        ${panel('Referring pages', list(r.referrerUrls, 'url'))}
        ${tabbed('Campaigns', [{ name: 'Sources', body: list(r.sources, 'text') }, { name: 'Mediums', body: list(r.mediums, 'text') }, { name: 'Campaigns', body: list(r.campaigns, 'text') }])}
        ${panel('Entry pages', list(r.entries, 'page', 'sessions'), 'where sessions began')}
        ${panel('Exit pages', list(r.exits, 'page', 'sessions'), 'where sessions ended')}
        ${tabbed('Devices', [{ name: 'Device', body: list(r.devices, 'text') }, { name: 'Browser', body: list(r.browsers, 'text') }, { name: 'System', body: list(r.oses, 'text') }, { name: 'Language', body: list(r.languages, 'lang') }])}
        ${panel('When people visit', heat(r.week), 'views by weekday and hour, your local time', 'two')}
        ${panel('Broken links', list(r.notFound, 'text'), 'pages that returned 404')}
        ${panel('Crawlers', list(r.bots.list.map((b) => ({ key: b.name, views: b.hits })), 'text', 'hits', ''), `${fmtN(r.bots.total)} hits, not counted above`)}
        ${eventsPanel(r.events)}
      </div>
      <p class="note">Counted by the site's own server as pages are served, so nothing runs in visitors' browsers and no cookies are set. A visitor is one person on one day: the same person on two days counts twice. Sessions end after 30 minutes of quiet. Crawlers are counted separately and never appear as visitors. Location comes from the network address and is accurate to roughly city level. Times are shown in your own time zone.</p>`;

    main.querySelectorAll('[data-paged]').forEach((box) => {
      const nav = box.querySelector('.pager');
      if (!nav) return;
      const rows = [...box.querySelector('[data-rows]').children];
      const pos = nav.querySelector('[data-pos]');
      const prev = nav.querySelector('[data-prev]');
      const next = nav.querySelector('[data-next]');
      const last = Math.ceil(rows.length / PAGE) - 1;
      let page = 0;
      const show = () => {
        const start = page * PAGE;
        const end = Math.min(rows.length, start + PAGE);
        rows.forEach((row, i) => { row.hidden = i < start || i >= end; });
        pos.textContent = `${fmtN(start + 1)}–${fmtN(end)} of ${fmtN(rows.length)}`;
        prev.disabled = page === 0;
        next.disabled = page === last;
        // A full page pins the panel's height, so a shorter last page leaves
        // the arrows where they were rather than pulling them up under the
        // cursor. Skipped while the panel is hidden behind a tab, when it
        // measures zero; the next full page measures it instead.
        if (end - start === PAGE && box.offsetHeight) box.style.minHeight = `${box.offsetHeight}px`;
      };
      prev.addEventListener('click', () => { if (page > 0) { page -= 1; show(); } });
      next.addEventListener('click', () => { if (page < last) { page += 1; show(); } });
      show();
    });
    main.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => {
      const section = b.closest('.panel');
      section.querySelectorAll('[data-tab]').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
      section.querySelectorAll('[data-tabpanel]').forEach((x) => { x.hidden = x.dataset.tabpanel !== b.dataset.tab; });
    }));
    hover(r.series, r.range.bucket);
    renderLive(r.live);
  }

  function hover(series, bucket) {
    const svg = main.querySelector('[data-chart]');
    if (!svg) return;
    const cursor = svg.querySelector('[data-cursor]');
    const tip = $('#tip');
    const W = 960, L = 40, R = 12;
    svg.addEventListener('mousemove', (e) => {
      const rect = svg.getBoundingClientRect();
      const fx = ((e.clientX - rect.left) / rect.width) * W;
      const i = Math.max(0, Math.min(series.length - 1, Math.round(((fx - L) / (W - L - R)) * (series.length - 1))));
      const s = series[i];
      const x = L + (series.length === 1 ? 0 : (i / (series.length - 1)) * (W - L - R));
      cursor.setAttribute('x1', x); cursor.setAttribute('x2', x); cursor.style.opacity = 1;
      const when = bucket === 'hour' ? `${s.t.slice(0, 10)} ${s.t.slice(11)}:00` : s.t;
      tip.textContent = `${when}: ${fmtN(s.visitors)} visitors, ${fmtN(s.pageviews)} views`;
      tip.style.left = `${rect.left + (x / W) * rect.width + window.scrollX}px`;
      tip.style.top = `${rect.top + window.scrollY}px`;
      tip.style.opacity = 1;
    });
    svg.addEventListener('mouseleave', () => { cursor.style.opacity = 0; tip.style.opacity = 0; });
  }

  loadTitles().then(() => { const r = rangeFor('30d'); setRange('30d', r.from, r.to); });
  setInterval(refreshLive, 60000);
})();
</script>
</body>
</html>
